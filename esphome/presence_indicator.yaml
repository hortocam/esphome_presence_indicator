# ESPHome Presence Indicator — ESP32 config
#
# NodeMCU-32S switches three colour channels of a 12V LED tally light (black =
# common +12V, red/yellow/green switched to GND) via low-side N-channel
# logic-level MOSFETs (STP16NF06L). Only ONE colour is ever active, so no
# current-stacking concern.
#
# STATUS: flashed + working (protoboard, mounted on monitor post).
# Pins: R=GPIO25, Y=GPIO26, G=GPIO27. GPIO25/26/27 sit on the same header
# edge as 5V/3V3, so routing to the FET gates is tidy. See docs/wiring.md.
# Boot state: green ALWAYS_ON, red/yellow ALWAYS_OFF -> device boots green
# (HA's meeting_state automation re-asserts the correct colour on HA start).

substitutions:
  device_name: presence-indicator
  friendly_name: Meeting Presence Tally

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: nodemcu-32s
  framework:
    type: arduino

# ############################### NETWORK #################################
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Static IP so monitoring/OTA is predictable. Uncomment + adjust.
  # manual_ip:
  #   static_ip: 172.16.20.x
  #   gateway: 172.16.20.1
  #   subnet: 255.255.255.0
  reboot_timeout: 0s

# ############################## MQTT / API ###############################
# Expose to Home Assistant via the native API (or MQTT discovery). HA is the
# source of truth — the device just turns the right colour on.
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  level: INFO

# ############################### OUTPUT ##################################
# Low-side N-channel MOSFET switches: GPIO HIGH -> colour ON. No inversion
# needed. Common-anode tally light (black = +12V; colour wires sink to GND).
# One STP16NF06L per colour, GPIO -> 1k -> gate (10k gate-to-GND pulldown),
# drain -> colour wire, source -> GND. Tie the 12V supply GND to ESP32 GND.
switch:
  - platform: gpio
    name: "Tally Red"
    id: tally_red
    pin: GPIO25
    restore_mode: ALWAYS_OFF

  - platform: gpio
    name: "Tally Yellow"
    id: tally_yellow
    pin: GPIO26
    restore_mode: ALWAYS_OFF

  - platform: gpio
    name: "Tally Green"
    id: tally_green
    pin: GPIO27
    restore_mode: ALWAYS_ON
