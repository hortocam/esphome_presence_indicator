# Meeting Presence Tally — Home Assistant package
#
# READY TO DROP IN. Put this file at /config/packages/tally_light.yaml
# (create the packages/ dir if needed), and enable packages in
# configuration.yaml if you don't already use them:
#
#   homeassistant:
#     packages: !include_dir_named packages
#
# Then in MuteDeck (on the WorkLaptop): Settings -> Notifications ->
# Enable Webhook, and paste this URL:
#
#   http://172.16.10.16:8123/api/webhook/mutedeck_status
#
# (If MuteDeck can't reach 172.16.10.16:8123 from the WorkLaptop, verify the
# cross-VLAN firewall allows VLAN20 -> HA. The tally ESP32 is already adopted
# in HA as switch.tally_red / _yellow / _green.)

# ---------------------------------------------------------------------------
# 1. Webhook endpoint MuteDeck POSTs to
# ---------------------------------------------------------------------------
webhook:
  - meeting_status:
      webhook_id: mutedeck_status

# ---------------------------------------------------------------------------
# 2. Raw MuteDeck status sensor (attributes hold the live fields)
#    State is published by the ingest automation below.
# ---------------------------------------------------------------------------
sensor:
  - platform: template
    name: MuteDeck Status
    id: mutedeck_status

# ---------------------------------------------------------------------------
# 3. Derived 4-state select (the single source of truth for automations)
#    Robust to the webhook omitting `call` — falls back to `control`
#    (control = "system" when free, the platform name when in a meeting).
# ---------------------------------------------------------------------------
select:
  - platform: template
    name: Meeting State
    options:
      - free
      - in_meeting
      - muted
      - dnd
    select_option:
      - service: template.publish
        target: { entity_id: select.meeting_state }
        data:
          state: "{{ option }}"
    value_template: >
      {% set c = state_attr('sensor.mutedeck_status', 'call') | default('inactive') %}
      {% set control = state_attr('sensor.mutedeck_status', 'control') | default('system') %}
      {% set m = state_attr('sensor.mutedeck_status', 'mute') | default('inactive') %}
      {% set r = state_attr('sensor.mutedeck_status', 'record') | default('disabled') %}
      {% set s = state_attr('sensor.mutedeck_status', 'share') | default('disabled') %}
      {% set in_meet = (c == 'active') or (control != 'system') %}
      {% if not in_meet %} free
      {% elif r == 'active' or s == 'active' %} dnd
      {% elif m == 'active' %} muted
      {% else %} in_meeting
      {% endif %}

# ---------------------------------------------------------------------------
# 4. Ingest: webhook -> raw sensor
# ---------------------------------------------------------------------------
automation:
  - id: mutedeck_ingest
    alias: "MuteDeck webhook -> status sensor"
    trigger:
      - platform: webhook
        webhook_id: mutedeck_status
    action:
      - variables:
          md: "{{ trigger.json }}"
      - service: template.publish
        target: { entity_id: sensor.mutedeck_status }
        data:
          state: "{{ md.control }}"
          attributes:
            call: "{{ md.call }}"
            mute: "{{ md.mute }}"
            video: "{{ md.video }}"
            share: "{{ md.share }}"
            record: "{{ md.record }}"
            timestamp: "{{ md.timestamp }}"

  # -------------------------------------------------------------------------
  # 5. Map the 4-state select to the tally light colours
  #    free -> green | in_meeting -> red | muted -> yellow | dnd -> green
  # -------------------------------------------------------------------------
  - id: meeting_state_to_tally
    alias: "Meeting state -> tally light"
    trigger:
      - platform: state
        entity_id: select.meeting_state
    action:
      - choose:
          - conditions: { condition: state, entity_id: select.meeting_state, state: in_meeting }
            sequence:
              - service: switch.turn_on
                target: { entity_id: switch.tally_red }
              - service: switch.turn_off
                target: { entity_id: [switch.tally_yellow, switch.tally_green] }
          - conditions: { condition: state, entity_id: select.meeting_state, state: muted }
            sequence:
              - service: switch.turn_on
                target: { entity_id: switch.tally_yellow }
              - service: switch.turn_off
                target: { entity_id: [switch.tally_red, switch.tally_green] }
          - default:   # free / dnd
            sequence:
              - service: switch.turn_on
                target: { entity_id: switch.tally_green }
              - service: switch.turn_off
                target: { entity_id: [switch.tally_red, switch.tally_yellow] }
